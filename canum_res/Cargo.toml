[package]
name = "canum_res"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {
  version = "0.19",
  default-features = false,
  features = [
    "bevy_asset",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui_render",
    "bevy_audio",
    "png",
    "vorbis",
    "wav",
  ]
}
bevy_image_font = {git = "https://github.com/impodog/bevy_image_font"}
log = "0.4.29"
rand = "0.10.1"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
