[package]
name = "canum_res"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "bevy_asset",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui_render",
    "bevy_audio",
    "png",
    "vorbis",
    "wav",
  ]
}
bevy_image_font = {git = "https://github.com/impodog/bevy_image_font"}
log = "0.4.34"
rand = "0.10.3"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
